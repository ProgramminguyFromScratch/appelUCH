<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <!-- simple black cannon, mouth pointing up-right as drawn (rotation 1); rotates 90deg per step.
       assets/cannon_front.svg is an identical copy that gets drawn over players. -->
  <g transform="translate(30 30) rotate(45) scale(0.9) translate(-30 -30)">
    <rect x="13" y="11" width="34" height="45" rx="4" fill="#2e3138" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
    <rect x="16" y="13" width="28" height="17" fill="#8b919c"/>
    <rect x="9" y="3" width="42" height="10" rx="3" fill="#3b3f48" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
    <rect x="12" y="38" width="36" height="6" fill="#4a4f5a" stroke="#000000" stroke-width="2"/>
  </g>
</svg>
